name: End-to-End Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # The suite exercises real auth, server actions and database mutations, so
    # it runs against a throwaway Postgres. Set the DATABASE_URL repository
    # secret to a Neon branch to test against Neon instead.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Set up environment file
        run: |
          DATABASE_URL="${{ secrets.DATABASE_URL }}"
          if [ -z "$DATABASE_URL" ]; then
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/blog_test"
          fi
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo "NEXTAUTH_URL=http://localhost:3000"
            echo "NODE_ENV=test"
          } > .env.test

      - name: Verify environment setup
        run: |
          echo "Checking .env.test file:"
          cat .env.test | sed 's/=.*/=***/'
          echo ""
          if grep -q "^DATABASE_URL=." .env.test; then
            echo "✓ DATABASE_URL is set"
          else
            echo "✗ DATABASE_URL missing" && exit 1
          fi
          if grep -q "^AUTH_SECRET=." .env.test; then
            echo "✓ AUTH_SECRET is set"
          else
            echo "✗ AUTH_SECRET missing" && exit 1
          fi

      - name: Run database migrations
        run: npx drizzle-kit push
        env:
          NODE_ENV: test

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
